# Configuration de Synapse pour MESSAF (jalon 1)
# Aucun secret ici : le mot de passe de la base vient de la variable PGPASSWORD,
# la clé de signature est générée dans /data au premier démarrage,
# les autres secrets sont lus dans le volume /secrets (deploy/init/generer-secrets.py).

# Domaine des identifiants (@matricule:gov.bf). Il ne pourra plus changer ensuite.
server_name: "gov.bf"
pid_file: /data/homeserver.pid

listeners:
  - port: 8008
    type: http
    tls: false
    x_forwarded: true
    bind_addresses: ['0.0.0.0']
    resources:
      # API client seulement : l'API de fédération n'est pas servie.
      - names: [client]
        compress: false

database:
  name: psycopg2
  args:
    user: messaf
    database: synapse
    host: postgres
    port: 5432
    cp_min: 5
    cp_max: 10

log_config: "/config/log.config"
media_store_path: /data/media_store
signing_key_path: "/data/gov.bf.signing.key"
macaroon_secret_key_path: /secrets/synapse_macaroon
# Pas de secret d'enregistrement : aucun compte ne se crée en contournant Keycloak.

# --- Fermeture aux serveurs extérieurs ---
federation_domain_whitelist: []   # aucune fédération, avec personne
trusted_key_servers: []           # pas de serveur de clés extérieur (matrix.org)
report_stats: false               # aucune statistique envoyée à l'extérieur

# --- Personne ne s'inscrit seul ---
enable_registration: false
allow_guest_access: false

# --- Connexion déléguée à MAS, qui s'appuie sur Keycloak (mot de passe + code TOTP) ---
# Synapse ne voit plus aucun mot de passe. MAS crée les comptes @m<matricule>:gov.bf
# à la première connexion et vérifie chaque jeton d'accès.
password_config:
  enabled: false

matrix_authentication_service:
  enabled: true
  endpoint: http://mas:8080/
  secret_path: /secrets/synapse_mas

# --- Minimisation des métadonnées ---
presence:
  enabled: false
url_preview_enabled: false

# Annuaire consultable par tous les agents enrôlés
user_directory:
  enabled: true
  search_all_users: true

max_upload_size: 50M
