components:
  schemas:
    AffectationEntree:
      properties:
        poste:
          type: string
          maxLength: 64
          minLength: 1
          title: Poste
        date_debut:
          type: string
          format: date
          title: Date Debut
        date_fin:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date Fin
      additionalProperties: false
      type: object
      required:
      - poste
      - date_debut
      title: AffectationEntree
    AnnuaireEntree:
      properties:
        email:
          type: boolean
          title: Email
          default: true
        telephone:
          type: boolean
          title: Telephone
          default: false
      additionalProperties: false
      type: object
      title: AnnuaireEntree
    Decision:
      properties:
        decision:
          type: string
          enum:
          - validee
          - refusee
          title: Decision
        interimaire:
          anyOf:
          - type: string
            pattern: ^[0-9]{6}$
          - type: 'null'
          title: Interimaire
          description: Le supérieur peut désigner un autre intérimaire
        motif:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Motif
      additionalProperties: false
      type: object
      required:
      - decision
      title: Decision
    Erreur:
      properties:
        message:
          type: string
          title: Message
          description: Message en français, à afficher tel quel
        code:
          type: string
          title: Code
          description: Code stable, à tester par le portail
        champs:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Champs
          description: Erreur de chaque champ refusé (422 seulement)
      type: object
      required:
      - message
      - code
      title: Erreur
      description: Format commun de toutes les erreurs de l'API.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IdentiteEntree:
      properties:
        matricule:
          type: string
          pattern: ^[0-9]{6}$
          title: Matricule
          description: 6 chiffres
        nom:
          type: string
          maxLength: 100
          minLength: 1
          title: Nom
        prenoms:
          type: string
          maxLength: 150
          minLength: 1
          title: Prenoms
        email:
          anyOf:
          - type: string
            maxLength: 254
            pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          - type: 'null'
          title: Email
        telephone:
          anyOf:
          - type: string
            maxLength: 30
            pattern: ^[0-9+ ().-]{6,30}$
          - type: 'null'
          title: Telephone
      additionalProperties: false
      type: object
      required:
      - matricule
      - nom
      - prenoms
      title: IdentiteEntree
    Motif:
      properties:
        motif:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Motif
      additionalProperties: false
      type: object
      title: Motif
    NouveauSalon:
      properties:
        interlocuteur:
          type: string
          maxLength: 64
          minLength: 1
          title: Interlocuteur
          description: Code de l'autre fonction, ex. DH-SANTE
        classification:
          type: string
          enum:
          - normal
          - diffusion_restreinte
          - confidentiel
          title: Classification
          description: Au plus l'habilitation requise par chacune des deux fonctions
          default: normal
      additionalProperties: false
      type: object
      required:
      - interlocuteur
      title: NouveauSalon
    NouvelAgent:
      properties:
        identite:
          $ref: '#/components/schemas/IdentiteEntree'
        profil:
          $ref: '#/components/schemas/ProfilEntree'
        habilitation:
          type: string
          enum:
          - normal
          - diffusion_restreinte
          - confidentiel
          title: Habilitation
        affectation:
          $ref: '#/components/schemas/AffectationEntree'
      additionalProperties: false
      type: object
      required:
      - identite
      - profil
      - habilitation
      - affectation
      title: NouvelAgent
    NouvelleAbsence:
      properties:
        matricule:
          anyOf:
          - type: string
            pattern: ^[0-9]{6}$
          - type: 'null'
          title: Matricule
          description: 'Absent : vous-même par défaut'
        statut:
          type: string
          enum:
          - en_mission
          - en_conge
          - absent
          title: Statut
        precision:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Precision
          description: Ex. joignable, injoignable, maladie, formation
        date_debut:
          type: string
          format: date
          title: Date Debut
        date_fin:
          type: string
          format: date
          title: Date Fin
        interimaire:
          anyOf:
          - type: string
            pattern: ^[0-9]{6}$
          - type: 'null'
          title: Interimaire
      additionalProperties: false
      type: object
      required:
      - statut
      - date_debut
      - date_fin
      title: NouvelleAbsence
    NouvellePassation:
      properties:
        poste:
          type: string
          maxLength: 64
          minLength: 1
          title: Poste
        entrant:
          type: string
          pattern: ^[0-9]{6}$
          title: Entrant
        sortant:
          anyOf:
          - type: string
            pattern: ^[0-9]{6}$
          - type: 'null'
          title: Sortant
          description: Obligatoire si le poste a plusieurs titulaires (secrétariat)
        date_effet:
          type: string
          format: date
          title: Date Effet
        motif:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Motif
      additionalProperties: false
      type: object
      required:
      - poste
      - entrant
      - date_effet
      title: NouvellePassation
    ProfilEntree:
      properties:
        ministere:
          type: string
          maxLength: 64
          minLength: 1
          title: Ministere
        direction:
          type: string
          maxLength: 64
          minLength: 1
          title: Direction
        service:
          type: string
          maxLength: 64
          minLength: 1
          title: Service
        annuaire:
          $ref: '#/components/schemas/AnnuaireEntree'
          default:
            email: true
            telephone: false
      additionalProperties: false
      type: object
      required:
      - ministere
      - direction
      - service
      title: ProfilEntree
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    OAuth2AuthorizationCodeBearer:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            openid: Identité de l'utilisateur
          authorizationUrl: http://localhost:8180/realms/messaf/protocol/openid-connect/auth
          tokenUrl: http://localhost:8180/realms/messaf/protocol/openid-connect/token
