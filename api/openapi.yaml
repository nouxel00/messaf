                $ref: '#/components/schemas/Erreur'
          description: Service Unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /passations/{id_}/annulation:
    post:
      tags:
      - Passations
      summary: Annuler une passation planifiée
      operationId: annuler_passation_passations__id___annulation_post
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: id_
        in: path
        required: true
        schema:
          type: integer
          title: 'Id '
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /absences:
    post:
      tags:
      - Absences et intérims
      summary: Déclarer une absence et proposer un intérimaire (validation par le
        supérieur)
      operationId: declarer_absence_absences_post
      security:
      - OAuth2AuthorizationCodeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NouvelleAbsence'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unprocessable Content
    get:
      tags:
      - Absences et intérims
      summary: Les absences du ministère (à valider, en cours, passées)
      operationId: lister_absences_absences_get
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: ministere
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ministere
      - name: etat
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Etat
      responses:
        '200':
          description: Successful Response
          content:
