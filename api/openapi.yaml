openapi: 3.1.0
info:
  title: API d'administration MESSAF
  description: 'Enrôlement, révocation et audit des agents ; fonctions, passations
    de service et intérims. Chaque appel exige un jeton Keycloak du domaine messaf
    : dans cette page, bouton « Authorize », puis connexion avec un compte du domaine
    (mot de passe et code TOTP). Fichier généré depuis le code de l''API (FastAPI)
    : ne pas le modifier à la main.'
  version: 2.0.0
paths:
  /sante:
    get:
      tags:
      - Service
      summary: L'API répond
      operationId: sante_sante_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /moi:
    get:
      tags:
      - Service
      summary: L'utilisateur connecté, tel que l'API le voit
      operationId: moi_moi_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`non_authentifie` : jeton absent, invalide ou expiré'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
      security:
      - OAuth2AuthorizationCodeBearer: []
  /structures:
    get:
      tags:
      - Référentiel
      summary: Le ministère et toutes ses directions et services
      operationId: structures_structures_get
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: ministere
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ministere
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`non_authentifie` : jeton absent, invalide ou expiré'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: '`interdit` : rôle ou périmètre insuffisant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: '`donnees_invalides` : le détail de chaque champ est dans `champs`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /postes:
    get:
      tags:
      - Référentiel
      summary: Les postes rattachés aux structures du ministère
      operationId: postes_postes_get
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: ministere
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ministere
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`non_authentifie` : jeton absent, invalide ou expiré'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: '`interdit` : rôle ou périmètre insuffisant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: '`donnees_invalides` : le détail de chaque champ est dans `champs`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /agents:
    get:
      tags:
      - Agents
      summary: Les agents d'un ministère
      operationId: lister_agents_agents_get
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: ministere
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ministere
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`non_authentifie` : jeton absent, invalide ou expiré'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: '`interdit` : rôle ou périmètre insuffisant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: '`donnees_invalides` : le détail de chaque champ est dans `champs`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '503':
          description: '`service_indisponible` : Keycloak ou MAS ne répond pas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
    post:
      tags:
      - Agents
      summary: Créer un agent (son enrôlement commence)
      operationId: creer_agent_agents_post
      security:
      - OAuth2AuthorizationCodeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NouvelAgent'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`non_authentifie` : jeton absent, invalide ou expiré'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: '`interdit` : rôle ou périmètre insuffisant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '409':
          description: '`matricule_existant` : ce matricule est déjà utilisé'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: '`donnees_invalides` : le détail de chaque champ est dans `champs`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '503':
          description: '`service_indisponible` : Keycloak ou MAS ne répond pas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /agents/{matricule}:
    get:
      tags:
      - Agents
      summary: Un agent
      operationId: obtenir_agent_agents__matricule__get
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: matricule
        in: path
        required: true
        schema:
          type: string
          title: Matricule
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`non_authentifie` : jeton absent, invalide ou expiré'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: '`interdit` : rôle ou périmètre insuffisant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: '`introuvable` : aucun agent ne porte ce matricule'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: '`donnees_invalides` : le détail de chaque champ est dans `champs`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '503':
          description: '`service_indisponible` : Keycloak ou MAS ne répond pas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /agents/{matricule}/fiche-enrolement:
    get:
      tags:
      - Agents
      summary: Fiche PDF avec un nouveau code d'activation (le précédent est annulé)
      operationId: fiche_enrolement_agents__matricule__fiche_enrolement_get
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: matricule
        in: path
        required: true
        schema:
          type: string
          title: Matricule
      responses:
        '200':
          description: Successful Response
          content:
            application/pdf: {}
        '401':
          description: '`non_authentifie` : jeton absent, invalide ou expiré'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: '`interdit` : rôle ou périmètre insuffisant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: '`introuvable` : aucun agent ne porte ce matricule'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '409':
          description: '`deja_active` : l''agent a déjà activé son compte ; `compte_revoque`
            : le compte est révoqué'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: '`donnees_invalides` : le détail de chaque champ est dans `champs`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '503':
          description: '`service_indisponible` : Keycloak ou MAS ne répond pas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /agents/{matricule}/revocation:
    post:
      tags:
      - Agents
      summary: 'Révoquer : connexion bloquée, toutes les sessions fermées'
      operationId: revoquer_agents__matricule__revocation_post
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: matricule
        in: path
        required: true
        schema:
          type: string
          title: Matricule
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/Motif'
              - type: 'null'
              title: Corps
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`non_authentifie` : jeton absent, invalide ou expiré'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: '`interdit` : rôle ou périmètre insuffisant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: '`introuvable` : aucun agent ne porte ce matricule'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '409':
          description: '`auto_revocation` : un administrateur ne peut pas révoquer
            son propre compte'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: '`donnees_invalides` : le détail de chaque champ est dans `champs`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '503':
          description: '`service_indisponible` : Keycloak ne répond pas ; `revocation_partielle`
            : compte bloqué dans Keycloak, mais MAS n''a pas répondu (relancer la
            révocation)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /agents/{matricule}/reactivation:
    post:
      tags:
      - Agents
      summary: Réactiver un compte révoqué
      operationId: reactiver_agents__matricule__reactivation_post
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: matricule
        in: path
        required: true
        schema:
          type: string
          title: Matricule
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/Motif'
              - type: 'null'
              title: Corps
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`non_authentifie` : jeton absent, invalide ou expiré'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: '`interdit` : rôle ou périmètre insuffisant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: '`introuvable` : aucun agent ne porte ce matricule'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: '`donnees_invalides` : le détail de chaque champ est dans `champs`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '503':
          description: '`service_indisponible` : Keycloak ou MAS ne répond pas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /audit:
    get:
      tags:
      - Audit
      summary: Journal d'audit, du plus récent au plus ancien
      operationId: audit_audit_get
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: ministere
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ministere
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: '`non_authentifie` : jeton absent, invalide ou expiré'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: '`interdit` : rôle ou périmètre insuffisant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: '`donnees_invalides` : le détail de chaque champ est dans `champs`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /fonctions:
    get:
      tags:
      - Fonctions
      summary: 'Les fonctions du ministère : titulaires, intérimaires, salons'
      operationId: lister_fonctions_fonctions_get
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: ministere
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ministere
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Forbidden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unprocessable Content
  /fonctions/{poste}:
    get:
      tags:
      - Fonctions
      summary: Une fonction et l'historique de ses titulaires
      operationId: obtenir_fonction_fonctions__poste__get
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: poste
        in: path
        required: true
        schema:
          type: string
          title: Poste
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /fonctions/{poste}/salons:
    post:
      tags:
      - Fonctions
      summary: Ouvrir le salon entre deux fonctions (le bot le crée et y invite les
        titulaires)
      operationId: ouvrir_salon_fonctions__poste__salons_post
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: poste
        in: path
        required: true
        schema:
          type: string
          title: Poste
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NouveauSalon'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Service Unavailable
  /passations:
    post:
      tags:
      - Passations
      summary: Planifier une passation de service (exécutée tout de suite si la date
        d'effet est atteinte)
      operationId: planifier_passation_passations_post
      security:
      - OAuth2AuthorizationCodeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NouvellePassation'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Service Unavailable
    get:
      tags:
      - Passations
      summary: Les passations du ministère, de la plus récente à la plus ancienne
      operationId: lister_passations_passations_get
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: ministere
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ministere
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Forbidden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unprocessable Content
  /passations/{id_}/execution:
    post:
      tags:
      - Passations
      summary: Relancer une passation en échec, ou exécuter une passation dont la
        date est atteinte
      operationId: relancer_passation_passations__id___execution_post
      security:
      - OAuth2AuthorizationCodeBearer: []
      parameters:
      - name: id_
        in: path
        required: true
        schema:
          type: integer
          title: 'Id '
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Forbidden
        '404':
          content:
            application/json:
