# Compile l'image Docker du bot de fonction sur les serveurs de GitHub et la publie sur ghcr.io.
# docker compose la télécharge ensuite : aucune compilation Rust sur la machine de démonstration.
name: Image du bot de fonction

on:
  push:
    branches: [ main ]
    paths: [ 'bots/fonction/**', '.github/workflows/bot-fonction.yml' ]
  pull_request:
    paths: [ 'bots/fonction/**', '.github/workflows/bot-fonction.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bot-fonction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Compiler et publier l'image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Publication seulement depuis main ; une demande de fusion compile sans publier
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nom de l'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/messaf-bot-fonction" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bots/fonction
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Bot de fonction de MESSAF
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
